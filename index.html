<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaviko | Game Portal</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #131c31;
            --card-border: #1e294b;
            --accent-blue: #38bdf8;
            --accent-purple: #818cf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            max-width: 600px;
        }

        h1 {
            font-size: 3rem;
            margin: 0 0 10px 0;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin: 0;
        }

        /* Filter Buttons Bar */
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 40px;
            max-width: 900px;
        }

        .filter-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        /* Game Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 1200px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: var(--accent-blue);
            box-shadow: 0 20px 30px -10px rgba(56, 189, 248, 0.15);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(129, 140, 248, 0.15);
            color: var(--accent-purple);
        }

        .card h3 {
            margin: 0 0 8px 0;
            font-size: 1.3rem;
            color: var(--text-main);
        }

        .play-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 20px;
        }

        .play-btn:hover {
            opacity: 0.9;
        }

        .play-btn:active {
            transform: scale(0.98);
        }

        footer {
            margin-top: 60px;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>Zaviko Portal</h1>
        <p>Instant high-performance browser games, curated for quick sessions.</p>
    </header>

    <!-- Category Filter Bar -->
    <div class="filters" id="filterContainer">
        <button class="filter-btn active" onclick="filterGames('All')">All Games</button>
        <button class="filter-btn" onclick="filterGames('Arcade')">Arcade</button>
        <button class="filter-btn" onclick="filterGames('FPS')">FPS</button>
        <button class="filter-btn" onclick="filterGames('Driving')">Driving</button>
        <button class="filter-btn" onclick="filterGames('Runner/Platformer')">Runner & Platformer</button>
        <button class="filter-btn" onclick="filterGames('Sports')">Sports</button>
        <button class="filter-btn" onclick="filterGames('Simulation')">Simulation</button>
        <button class="filter-btn" onclick="filterGames('Strategy')">Strategy</button>
    </div>

    <!-- Game Cards Container -->
    <div class="grid" id="gameGrid"></div>

    <footer>
        Zaviko Portal &bull; Powered by Cloudflare Pages
    </footer>

    <script>
        const games = [
          { name: 'Cookie Clicker', category: 'Arcade', url: 'https://texasearlystatehood-mexicorule.blxcksoul111.workers.dev/' },
          { name: 'Slow Roads', category: 'Driving', url: 'https://texasearlystatehood-cordovarebellion.blxcksoul111.workers.dev/' },
          { name: 'Alchemy 2', category: 'Simulation', url: 'https://texasearlystatehood-santafe.blxcksoul111.workers.dev/' },
          { name: 'ShellShockers', category: 'FPS', url: 'https://texasearlystatehood-santanna.blxcksoul111.workers.dev/' },
          { name: 'Classic Snake', category: 'Arcade', url: 'https://slyth.kabyik.dev/' },
          { name: 'Subway Surfers', category: 'Runner/Platformer', url: 'https://texasearlystatehood-gcc.blxcksoul111.workers.dev/' },
          { name: 'Bounce', category: 'Runner/Platformer', url: 'https://texasearlystatehood-ma.blxcksoul111.workers.dev/' },
          { name: 'Basketball Stars', category: 'Sports', url: 'https://texasearlystatehood-houston.blxcksoul111.workers.dev/' },
          { name: 'Pako Highway', category: 'Driving', url: 'https://texasearlystatehood-haden-ed.blxcksoul111.workers.dev/' },
          { name: 'Retro Bowl', category: 'Sports', url: 'https://texasearlystatehood-mire-lamar.blxcksoul111.workers.dev/' },
          { name: 'Flappy Bird', category: 'Arcade', url: 'https://texasearlystatehood-loren-zavala.blxcksoul111.workers.dev/' },
          { name: 'Sci-Fi Shooter', category: 'FPS', url: 'https://texasearlystatehood-an-jones.blxcksoul111.workers.dev/' },
          { name: 'FPS Shooter', category: 'FPS', url: 'https://texasearlystatehood-ed-burl.blxcksoul111.workers.dev/' },
          { name: 'RocketLauncherSim', category: 'Simulation', url: 'https://texasearlystatehood-tejanos.blxcksoul111.workers.dev/' },
          { name: 'OpenFront', category: 'Strategy', url: 'https://texasearlystatehood-openfront.blxcksoul111.workers.dev/' },
          { name: 'SpeedStar', category: 'Runner/Platformer', url: 'https://texasearlystatehood-speedstar.blxcksoul111.workers.dev/' },
          { name: 'Liquid Soccer', category: 'Sports', url: 'https://texasearlystatehood-capital.blxcksoul111.workers.dev/' }
        ];

        function renderGames(filter = 'All') {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = '';

            const filtered = filter === 'All' ? games : games.filter(g => g.category === filter);

            filtered.forEach(game => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <h3>${game.name}</h3>
                            <span class="badge">${game.category}</span>
                        </div>
                    </div>
                    <a href="${game.url}" target="_blank" class="play-btn">Play Now</a>
                `;
                grid.appendChild(card);
            });
        }

        function filterGames(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderGames(category);
        }

        // Initial render on load
        renderGames('All');
    </script>
</body>
</html>
