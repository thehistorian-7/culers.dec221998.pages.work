 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit 4 Study Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 24px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    /* Header & Search */
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px; border-bottom: 1px solid #1e293b; padding-bottom: 16px; flex-shrink: 0; }
    h1 { font-size: 1.5rem; font-weight: 700; }
    .controls { display: flex; gap: 12px; align-items: center; }
    #countBadge { background: #1e293b; padding: 6px 12px; border-radius: 999px; font-size: 0.85rem; color: #94a3b8; }
    #search { background: #1e293b; border: 1px solid #334155; color: #fff; padding: 8px 14px; border-radius: 8px; outline: none; width: 220px; }
    #search:focus { border-color: #38bdf8; }

    /* Scrollable Responsive Grid Container */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 16px;
      overflow-y: auto;
      flex: 1;
      padding-bottom: 24px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 110px;
    }
    .card:hover { transform: translateY(-3px); border-color: #38bdf8; }
    .card-title { font-size: 1.1rem; font-weight: 600; }
    .card-tag { font-size: 0.75rem; color: #38bdf8; margin-top: 12px; text-transform: uppercase; letter-spacing: 0.05em; }

    /* Fullscreen Iframe Player Overlay */
    #playerOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 100;
      flex-direction: column;
    }
    #playerBar {
      background: #0f172a;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
    }
    .btn { background: #334155; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn:hover { background: #475569; }
    .btn-close { background: #ef4444; }
    .btn-close:hover { background: #dc2626; }
    iframe { flex: 1; width: 100%; border: none; }
  </style>
</head>
<body>

  <header>
    <h1>Unit 4 Study Resources</h1>
    <div class="controls">
      <span id="countBadge">0 Modules</span>
      <input type="text" id="search" placeholder="Filter modules..." oninput="renderGames()">
    </div>
  </header>

  <main id="grid"></main>

  <!-- Player Modal -->
  <div id="playerOverlay">
    <div id="playerBar">
      <span id="activeTitle">Module</span>
      <div style="display: flex; gap: 8px;">
        <button class="btn" onclick="toggleFullscreen()">Fullscreen</button>
        <button class="btn btn-close" onclick="closeGame()">Back</button>
      </div>
    </div>
    <iframe id="gameFrame" allowfullscreen></iframe>
  </div>

  <script>
    // ==========================================
    // GAMES ARRAY WITH CUSTOM CATEGORIES
    // ==========================================
    const games = [
      { name: 'ShellShockers', category: 'FPS', url: 'https://texasearlystatehood-santanna.blxcksoul111.workers.dev/' },
      { name: 'Classic Snake', category: 'Arcade', url: 'https://slyth.kabyik.dev/' },
      { name: 'Subway Surfers', category: 'Runner/Platformer', url: 'https://texasearlystatehood-gcc.blxcksoul111.workers.dev/' },
      { name: 'Bounce', category: 'Platformer', url: 'https://texasearlystatehood-ma.blxcksoul111.workers.dev/' },
      { name: 'Basketball Stars', category: 'Sports', url: 'https://texasearlystatehood-houston.blxcksoul111.workers.dev/' },
      { name: 'Pako Highway', category: 'Driving', url: 'https://texasearlystatehood-haden-ed.blxcksoul111.workers.dev/' },
      { name: 'Retro Bowl', category: 'Sports', url: 'https://texasearlystatehood-mire-lamar.blxcksoul111.workers.dev/' },
      { name: 'Flappy Bird', category: 'Arcade', url: 'https://texasearlystatehood-loren-zavala.blxcksoul111.workers.dev/' },
      { name: 'Sci-Fi Shooter', category: 'FPS', url: 'https://texasearlystatehood-an-jones.blxcksoul111.workers.dev/' },
      { name: 'FPS Shooter', category: 'FPS', url: 'https://texasearlystatehood-ed-burl.blxcksoul111.workers.dev/' },
      { name: 'RocketLauncherSim', category: 'Simulation', url: 'https://texasearlystatehood-tejanos.blxcksoul111.workers.dev/' }
      { name: 'OpenFront', category: 'Strategy', url: 'https://texasearlystatehood-openfront.blxcksoul111.workers.dev/' }
      { name: 'SpeedStar', category: 'Runner/Platformer', url: 'https://texasearlystatehood-openfront.blxcksoul111.workers.dev/' }
    ];

    const grid = document.getElementById('grid');
    const countBadge = document.getElementById('countBadge');
    const searchInput = document.getElementById('search');
    const overlay = document.getElementById('playerOverlay');
    const frame = document.getElementById('gameFrame');
    const activeTitle = document.getElementById('activeTitle');

    function renderGames() {
      const query = searchInput.value.toLowerCase();
      // Searches both game name AND category text now!
      const filtered = games.filter(g => 
        g.name.toLowerCase().includes(query) || g.category.toLowerCase().includes(query)
      );
      
      countBadge.textContent = `${filtered.length} ${filtered.length === 1 ? 'Module' : 'Modules'}`;
      grid.innerHTML = '';

      filtered.forEach((game) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-title">${game.name}</div>
          <div class="card-tag">${game.category}</div>
        `;
        card.onclick = () => openGame(game);
        grid.appendChild(card);
      });
    }

    function openGame(game) {
      activeTitle.textContent = game.name;
      frame.src = game.url;
      overlay.style.display = 'flex';
    }

    function closeGame() {
      overlay.style.display = 'none';
      frame.src = ''; 
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        overlay.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    }

    // Initial render
    renderGames();
  </script>

</body>
</html>
